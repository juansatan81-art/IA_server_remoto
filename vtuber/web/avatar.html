<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar VTuber</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* la cámara (camara.js) coloca y escala el lienzo: zoom con la rueda, arrastrar para mover */
  #lienzo { position: absolute; display: block; touch-action: none; cursor: grab; }
  #lienzo:active { cursor: grabbing; }
  #aviso {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); color: #fff; font: 600 22px system-ui, sans-serif; cursor: pointer;
  }
  #aviso[hidden], #subtitulo[hidden] { display: none; }
  #subtitulo {
    position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); max-width: 80vw;
    padding: .5em 1em; border-radius: 12px; background: rgba(0, 0, 0, .75); color: #fff;
    font: 600 clamp(16px, 3.2vh, 34px) system-ui, sans-serif; text-align: center;
  }
</style>
</head>
<body>
<canvas id="lienzo" width="1300" height="1140"></canvas>
<div id="subtitulo" hidden></div>
<div id="aviso" hidden>Haz clic para activar el sonido</div>
<script src="camara.js"></script>
<script src="avatar.js"></script>
</body>
</html>
